<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: headMapa('Mapa de sismos')}"></head>
<body>
<div th:replace="~{fragments/layout :: barra('sismos')}"></div>
<main class="contenedor">
    <div class="encabezado">
        <div>
            <h1>Mapa de sismos</h1>
            <p class="subtitulo">Ubicación de los eventos sísmicos registrados en el Perú.</p>
        </div>
        <a class="boton-secundario" th:href="@{/sismos}">Ver listado</a>
    </div>

    <div class="alerta alerta-error" th:if="${!filtro.avisos.isEmpty()}">
        <div th:each="aviso : ${filtro.avisos}" th:text="${aviso}"></div>
    </div>

    <section class="tarjeta">
        <form method="get" th:action="@{/sismos/mapa}" class="filtros">
            <label>
                <span>Departamento</span>
                <select name="departamentoId">
                    <option value="">Todos</option>
                    <option th:each="d : ${departamentos}" th:value="${d.id}" th:text="${d.nombre}"
                            th:selected="${d.id == filtro.departamentoId}"></option>
                </select>
            </label>
            <label>
                <span>Magnitud desde</span>
                <input name="magnitudMin" type="number" step="0.1" min="0" max="10"
                       th:value="${filtro.magnitudMin}">
            </label>
            <label>
                <span>Magnitud hasta</span>
                <input name="magnitudMax" type="number" step="0.1" min="0" max="10"
                       th:value="${filtro.magnitudMax}">
            </label>
            <label>
                <span>Desde</span>
                <input name="desde" type="date" th:value="${filtro.desde}">
            </label>
            <label>
                <span>Hasta</span>
                <input name="hasta" type="date" th:value="${filtro.hasta}">
            </label>
            <div class="acciones">
                <button class="boton" type="submit">Aplicar filtros</button>
                <a class="boton-secundario" th:href="@{/sismos/mapa}">Limpiar filtros</a>
            </div>
        </form>
    </section>

    <section class="tarjeta">
        <div class="barra-resultados">
            <span th:text="${sismosMapa.size()} + ' sismo(s) coinciden con los filtros.'"></span>
            <span class="nota">Seleccione un marcador para ver el resumen del evento.</span>
        </div>
        <p class="alerta alerta-info" th:if="${sismosMapa.isEmpty() and filtro.tieneFiltros}">
            Ningún sismo cumple los filtros seleccionados.
        </p>
        <p class="alerta alerta-info" th:if="${sismosMapa.isEmpty() and !filtro.tieneFiltros}">
            No hay sismos registrados.
        </p>
        <div th:replace="~{fragments/mapa :: visualizador(${sismosMapa}, null, null, 5)}"></div>
    </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/mapa-sismos.js}"></script>
</body>
</html>
