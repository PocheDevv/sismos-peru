<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar seguimiento')}"></head>
<body>
<div th:replace="~{fragments/layout :: barra('sismos')}"></div>
<main class="contenedor">
    <p class="breadcrumb">
        <a th:href="@{/sismos}">Sismos</a> /
        <a th:href="@{/sismos/{id}(id=${sismo.id})}" th:text="${sismo.codigo}"></a> /
        <span>Registrar seguimiento</span>
    </p>
    <h1>Registrar seguimiento</h1>
    <p class="subtitulo">
        Sismo <strong th:text="${sismo.codigo}"></strong>
        · <span th:text="${#temporals.format(sismo.fechaHora, 'dd/MM/yyyy HH:mm')}"></span>
        · <span th:text="${sismo.ubigeo.ubicacionCompleta}"></span>.
        Los campos marcados con * son obligatorios.
    </p>

    <form method="post" th:object="${seguimientoForm}" novalidate
          th:action="@{/sismos/{id}/seguimientos(id=${sismo.id})}">
        <div th:replace="~{fragments/layout :: erroresFormulario('registrar el seguimiento')}"></div>

        <section class="tarjeta">
            <div class="seccion-titulo">Datos del seguimiento</div>
            <div class="formulario-grid dos-columnas">
                <label>
                    <span class="campo-obligatorio">Fecha y hora de la actualización</span>
                    <input type="datetime-local" th:field="*{fechaActualizacion}" th:errorclass="campo-error"
                           th:min="${#temporals.format(sismo.fechaHora, 'yyyy-MM-dd''T''HH:mm')}">
                    <span class="ayuda-error" th:if="${#fields.hasErrors('fechaActualizacion')}" th:errors="*{fechaActualizacion}"></span>
                    <span class="ayuda" th:unless="${#fields.hasErrors('fechaActualizacion')}">Entre la ocurrencia del sismo y el momento actual.</span>
                </label>
                <label>
                    <span class="campo-obligatorio">Responsable</span>
                    <input type="text" th:field="*{responsable}" maxlength="100" th:errorclass="campo-error"
                           placeholder="Ej. Ing. Rosa Quispe - COER Arequipa">
                    <span class="ayuda-error" th:if="${#fields.hasErrors('responsable')}" th:errors="*{responsable}"></span>
                </label>
                <label class="ancho-completo">
                    <span class="campo-obligatorio">Observaciones</span>
                    <textarea th:field="*{observaciones}" rows="3" maxlength="500" th:errorclass="campo-error"
                              placeholder="Ej. Se registraron 3 réplicas menores; continúan las fisuras en viviendas de adobe."></textarea>
                    <span class="ayuda-error" th:if="${#fields.hasErrors('observaciones')}" th:errors="*{observaciones}"></span>
                    <span class="ayuda" th:unless="${#fields.hasErrors('observaciones')}">Máximo 500 caracteres.</span>
                </label>
                <label class="ancho-completo">
                    <span class="campo-obligatorio">Acciones realizadas</span>
                    <textarea th:field="*{accionesRealizadas}" rows="3" maxlength="500" th:errorclass="campo-error"
                              placeholder="Ej. Inspección de viviendas afectadas y entrega de carpas a 12 familias."></textarea>
                    <span class="ayuda-error" th:if="${#fields.hasErrors('accionesRealizadas')}" th:errors="*{accionesRealizadas}"></span>
                    <span class="ayuda" th:unless="${#fields.hasErrors('accionesRealizadas')}">Máximo 500 caracteres.</span>
                </label>
            </div>
        </section>

        <div class="acciones">
            <button class="boton" type="submit">Registrar seguimiento</button>
            <a class="boton-secundario" th:href="@{/sismos/{id}(id=${sismo.id})}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
