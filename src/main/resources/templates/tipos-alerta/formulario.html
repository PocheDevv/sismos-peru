<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo tipo de alerta')}"></head>
<body>
<div th:replace="~{fragments/layout :: barra('alertas')}"></div>
<main class="contenedor">
    <p class="breadcrumb"><a th:href="@{/tipos-alerta}">Tipos de alerta</a> / Nuevo</p>
    <h1>Nuevo tipo de alerta</h1>
    <p class="subtitulo">Los campos marcados con * son obligatorios. El código no se puede repetir.</p>
    <form method="post" th:action="@{/tipos-alerta}" th:object="${tipoAlertaForm}" novalidate class="formulario-corto">
        <div th:replace="~{fragments/layout :: erroresFormulario('registrar el tipo de alerta')}"></div>
        <section class="tarjeta">
            <div class="formulario-grid dos-columnas">
                <label>
                    <span class="campo-obligatorio">Código</span>
                    <input th:field="*{codigo}" maxlength="10" placeholder="Ej. INFO" th:errorclass="campo-error">
                    <span class="ayuda-error" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></span>
                </label>
                <label>
                    <span class="campo-obligatorio">Nombre</span>
                    <input th:field="*{nombre}" maxlength="60" th:errorclass="campo-error">
                    <span class="ayuda-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                </label>
                <label>
                    <span class="campo-obligatorio">Color</span>
                    <select th:field="*{color}" th:errorclass="campo-error">
                        <option value="">Seleccione</option>
                        <option th:each="c : ${colores}" th:value="${c}" th:text="${c}"></option>
                    </select>
                    <span class="ayuda-error" th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></span>
                </label>
                <label>
                    <span class="campo-obligatorio">Prioridad</span>
                    <input type="number" min="1" th:field="*{prioridad}" th:errorclass="campo-error">
                    <span class="ayuda-error" th:if="${#fields.hasErrors('prioridad')}" th:errors="*{prioridad}"></span>
                    <span class="ayuda" th:unless="${#fields.hasErrors('prioridad')}">Número positivo; 1 es la menos grave.</span>
                </label>
                <label class="ancho-completo">
                    <span>Descripción</span>
                    <textarea th:field="*{descripcion}" maxlength="200" rows="2" th:errorclass="campo-error"></textarea>
                    <span class="ayuda-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
                </label>
                <label>
                    <span class="campo-obligatorio">Estado</span>
                    <select th:field="*{estado}" th:errorclass="campo-error">
                        <option value="ACTIVO">ACTIVO</option>
                        <option value="INACTIVO">INACTIVO</option>
                    </select>
                </label>
            </div>
        </section>
        <div class="acciones">
            <button class="boton" type="submit">Registrar</button>
            <a class="boton-secundario" th:href="@{/tipos-alerta}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
