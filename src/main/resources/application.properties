spring.application.name=sismos-peru

# Conexión a MySQL. La contraseña NO se escribe aquí: cada integrante la pone en
# src/main/resources/application-local.properties (ignorado por git) o en la
# variable de entorno DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/sismos_peru?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.config.import=optional:classpath:application-local.properties

# Las tablas las crean los scripts de database/; Hibernate solo valida que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.port=8080
server.servlet.session.tracking-modes=cookie
